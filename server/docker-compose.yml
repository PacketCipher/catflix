version: '3.8'

services:
  app:
    build: .
    container_name: catflix-app
    restart: unless-stopped
    environment:
       - AES_KEY_B64=${AES_KEY_B64}   # Set in .env file
    volumes:
      - ./cat_cache:/var/cat_cache    # Mount local cache directory
    networks:
      - catflix-network

  nginx:
    image: nginx:alpine
    container_name: catflix-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot/:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - catflix-network

  certbot:
    image: certbot/certbot
    container_name: catflix-certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - catflix-network

networks:
  catflix-network:
    driver: bridge
